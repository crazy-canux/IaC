apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: milvus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  sources:
    - repoURL: https://github.com/milvus-io/milvus-helm.git
      targetRevision: main
      path: charts/milvus
      helm:
        releaseName: milvus
        valueFiles:
          - $values/helm/milvus/values.yaml
    - repoURL: https://github.com/crazy-canux/IaC.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: milvus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true